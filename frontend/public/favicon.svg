<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="ekBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4b3e"/>
      <stop offset="100%" stop-color="#0f2b23"/>
    </linearGradient>
    <linearGradient id="ekAccentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b4e04b"/>
      <stop offset="100%" stop-color="#96c138"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Rounded App Icon Badge -->
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="url(#ekBgGrad)"/>
  
  <!-- Subtle inner border rim -->
  <rect x="24" y="24" width="464" height="464" rx="116" ry="116" fill="none" stroke="url(#ekAccentGrad)" stroke-width="6" stroke-opacity="0.3"/>

  <!-- Elite Spark at top right -->
  <path d="M375 132 L388 164 L420 177 L388 190 L375 222 L362 190 L330 177 L362 164 Z" fill="url(#ekAccentGrad)" filter="url(#subtleShadow)"/>

  <!-- Shopping Cart Body & Wheels -->
  <g filter="url(#subtleShadow)">
    <!-- Cart Handle & Basket chassis -->
    <path d="M120 160 H164 L204 316 C207 328 218 336 230 336 H364 C376 336 386 328 390 316 L422 216 C426 204 416 192 404 192 H180" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Dynamic Accent Speed Bars inside basket -->
    <line x1="228" y1="240" x2="380" y2="240" stroke="url(#ekAccentGrad)" stroke-width="18" stroke-linecap="round"/>
    <line x1="240" y1="284" x2="340" y2="284" stroke="url(#ekAccentGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- Left Wheel -->
    <circle cx="236" cy="386" r="28" fill="url(#ekAccentGrad)"/>
    <circle cx="236" cy="386" r="12" fill="#1e4b3e"/>

    <!-- Right Wheel -->
    <circle cx="356" cy="386" r="28" fill="url(#ekAccentGrad)"/>
    <circle cx="356" cy="386" r="12" fill="#1e4b3e"/>
  </g>
</svg>
